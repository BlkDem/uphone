version: "3.8"

services:
  mariadb:
    image: mariadb:11.4
    container_name: uphone-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-uphone}
      MYSQL_USER: ${DB_USER:-uphone}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ../server
      dockerfile: ../docker/Dockerfile.server
    container_name: uphone-server
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ${DB_USER:-uphone}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-uphone}
      SERVER_PORT: ${SERVER_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET}
      UPLOAD_BASE_URL: ${UPLOAD_BASE_URL:-http://localhost:8080}
      FCM_CREDENTIALS: /app/service-account.json
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: uphone-uploads
      MINIO_USE_SSL: "false"
      TURN_URL: ${TURN_URL:-}
      TURN_USER: ${TURN_USER:-}
      TURN_PASS: ${TURN_PASS:-}
    ports:
      - "8080:8080"
    volumes:
      - ../server/service-account.json:/app/service-account.json:ro

  # To add Coturn TURN/STUN server for Docker:
  #   docker run -d --name uphone-turn --network host \
  #     -e TURN_PORT=3478 \
  #     -e TURN_USERNAME=uphone \
  #     -e TURN_PASSWORD=your-secret \
  #     -e TURN_REALM=your-domain.com \
  #     instrumentisto/coturn:latest
  # Then set TURN_URL=turn:your-domain.com:3478 in server env

  minio:
    image: minio/minio:latest
    container_name: uphone-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-uphone_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  mariadb_data:
  minio_data:
